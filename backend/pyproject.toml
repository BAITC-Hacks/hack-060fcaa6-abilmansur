[project]
name = "fin-investigator"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.2.157",
    "duckdb>=1.5.5",
    "fastapi>=0.141.1",
    "networkx>=3.7",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "scipy>=1.18.1",
    "sse-starlette>=3.4.11",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
