[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "money-graph"
version = "0.1.0"
description = "Explainable local transaction graph analytics with a Codex assistant"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.141,<0.142",
  "uvicorn[standard]>=0.53,<0.54",
  "pandas>=3.0,<3.1",
  "pyarrow>=25,<26",
  "networkx>=3.7,<3.8",
  "scipy>=1.18,<1.19",
  "openai-codex==0.156.1",
]

[dependency-groups]
dev = ["pytest>=9,<10", "httpx>=0.28,<0.29", "ruff>=0.16,<0.17"]

[project.scripts]
money-graph = "money_graph.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/money_graph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
